<section class="page-section" data-page="service_contracts"><h1>Service Contracts</h1><p>Company-scoped service coverage and lifecycle authority.</p><table><thead><tr><th>Number</th><th>Customer</th><th>Status</th></tr></thead><tbody data-service-list="contracts"></tbody></table><script type="module">const j=await (await fetch('/api/v1/service/contracts')).json();document.querySelector('[data-service-list]').innerHTML=(j.data||[]).map(x=>`<tr><td>${x.contract_number}</td><td>${x.customer_id}</td><td>${x.status}</td></tr>`).join('');</script></section>
