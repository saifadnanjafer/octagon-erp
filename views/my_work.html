<section class="page workshop-ops-page" id="pageMyWork" data-workshop-page="my-work">
  <div class="workshop-ops-hero">
    <div>
      <p class="workshop-ops-eyebrow">العمليات الشخصية</p>
      <h1><span aria-hidden="true">✓</span> عملي</h1>
      <p>يعرض فقط العمل المُسند فعلياً للمستخدم الحالي، عبر جهات العمل الرسمية.</p>
    </div>
    <div class="workshop-ops-hero-actions">
      <span class="workshop-freshness" id="myWorkFreshness">لم يُحمَّل بعد</span>
      <button class="btn-secondary" type="button" id="myWorkRefresh">تحديث</button>
    </div>
  </div>
  <div class="workshop-scope-strip" id="myWorkScope"></div>
  <div class="my-work-summary" id="myWorkSummary" aria-label="ملخص عملي"></div>
  <div class="my-work-presets" id="myWorkPresets" role="tablist" aria-label="طرق عرض العمل"></div>
  <details class="my-work-saved" id="myWorkSavedPanel">
    <summary>العروض المحفوظة <span id="myWorkSavedCount">0</span></summary>
    <div id="myWorkSavedViews" class="my-work-saved-list"></div>
  </details>
  <form class="my-work-filters" id="myWorkFilters" aria-label="مرشحات عملي">
    <label>نوع المهمة<select name="task_family"><option value="">كل الأنواع</option></select></label>
    <label>الحالة<select name="status"><option value="">كل الحالات</option></select></label>
    <label>الأولوية<select name="priority"><option value="">كل الأولويات</option></select></label>
    <label>الاستحقاق<select name="due"><option value="">أي تاريخ</option><option value="today">يستحق اليوم</option><option value="overdue">متأخر</option><option value="none">بلا تاريخ استحقاق</option></select></label>
    <label>المستودع<select name="warehouse_id"><option value="">النطاق النشط</option></select></label>
    <button type="reset" class="btn-secondary">مسح</button>
  </form>
  <div class="my-work-source-status" id="myWorkSourceStatus"></div>
  <div class="my-work-list" id="myWorkBody"><div class="workshop-loading"><span class="workshop-spinner"></span> جارٍ تحميل العمل المُسند…</div></div>
</section>
