<section class="page-section" data-page="electronic_signatures"><h1>Electronic Signatures</h1><p>Provider-neutral, simulator-only signing evidence.</p><table><thead><tr><th>Source</th><th>Status</th><th>Checksum</th></tr></thead><tbody data-service-list="signatures"></tbody></table><script type="module">const j=await (await fetch('/api/v1/service/signatures')).json();document.querySelector('[data-service-list]').innerHTML=(j.data||[]).map(x=>`<tr><td>${x.source_entity}:${x.source_record_id}</td><td>${x.status}</td><td>${x.source_checksum}</td></tr>`).join('');</script></section>
