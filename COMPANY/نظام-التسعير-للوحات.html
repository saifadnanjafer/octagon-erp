function calculate(){
  const o = state.options, d = state.dimensions;
  const M = PRICING_CONFIG.MODIFIERS;
  const units = (d.width * d.height) / PRICING_CONFIG.UNIT_AREA;

  let subtotal = PRICING_CONFIG.BASE_PRICE_PER_UNIT * units;
  let items = [{ label: 'السعر الأساسي (أكريليك '+M.acrylicThickness[o.acrylicThickness].label+')', value: subtotal }];

  const acrylicAdd = M.acrylicThickness[o.acrylicThickness].addPerUnit * units;
  if(acrylicAdd > 0){ subtotal += acrylicAdd; items.push({ label:'إضافة سماكة '+M.acrylicThickness[o.acrylicThickness].label, value: acrylicAdd }); }

  // إضافات على المتر
  [
    { key:'layers',     val:M.layers.value,     label:'طبقات إضافية', mult:true },
    { key:'perforated', val:M.perforated.value, label:'مثقب (وجه)' },
    { key:'uvPrinting', val:M.uvPrinting.value, label:'طباعة UV' },
    { key:'backLight',  val:M.backLight.value,  label:'إنارة خلفية' },
    { key:'cobondBack', val:M.cobondBack.value, label:'كوبوند خلفي' },
  ].forEach(function(m){
    if(o[m.key]){
      const cost = m.mult ? (m.val * o[m.key] * units) : (m.val * units);
      subtotal += cost; items.push({ label: m.label, value: cost });
    }
  });

  const sc = M.sideType[o.sideType].value * units;
  if(sc > 0){ subtotal += sc; items.push({ label:'اللف الجانبي ('+M.sideType[o.sideType].label+')', value:sc }); }

  const lc = M.ledType[o.ledType].value * units;
  if(lc!==0){ subtotal+=lc; items.push({ label:'نوع الليد ('+M.ledType[o.ledType].label+')', value:lc }); }

  const atyp = M.acrylicType[o.acrylicType].flatDiscount;
  if(atyp!==0){ subtotal+=atyp; items.push({ label:'أكريليك '+M.acrylicType[o.acrylicType].label, value:atyp }); }

  const tc = M.transformerType[o.transformerType].value * units;
  if(tc!==0){ subtotal+=tc; items.push({ label:'نوع المحول ('+M.transformerType[o.transformerType].label+')', value:tc }); }

  if(o.frameBack !== 'none'){
    const fc = M.frameBack[o.frameBack].value * units;
    subtotal += fc; items.push({ label:'حديد/ألمنيوم ('+M.frameBack[o.frameBack].label+')', value:fc });
  }

  // تكاليف ثابتة
  if(o.crane){ subtotal+=M.crane.value; items.push({ label:'كرين رافعة', value:M.crane.value }); }

  if(o.designFee && o.designFeeCost>0){ subtotal+=o.designFeeCost; items.push({ label:'رسوم تصميم', value:o.designFeeCost }); }

  const rc = M.rushOrder[o.rushOrder].value;
  if(rc>0){ subtotal+=rc; items.push({ label:'طلب مستعجل ('+M.rushOrder[o.rushOrder].label+')', value:rc }); }

  const dc = o.installDifficulty==='complex' ? (o.installComplexCost||0) : 0;
  if(dc>0){ subtotal+=dc; items.push({ label:'أجور تركيب (معقد)', value:dc }); }

  // ضمان ليد إضافي (الصيني بسنة واحدة فقط، لا إضافة)
  if(o.ledType !== 'economic' && o.ledExtraYears > 0){
    const lwc = o.ledExtraYears * M.extraWarrantyPerYear;
    subtotal+=lwc; items.push({ label:'ضمان ليد إضافي ('+o.ledExtraYears+' سنة)', value:lwc });
  }
  // ضمان محولة إضافي
  if(o.transformerExtraYears > 0){
    const twc = o.transformerExtraYears * M.extraWarrantyPerYear;
    subtotal+=twc; items.push({ label:'ضمان محولة إضافي ('+o.transformerExtraYears+' سنة)', value:twc });
  }

  if(o.hasCementBoard){
    const cb = state.cementBoardDims;
    const areaM2 = (cb.width * cb.height) / 10000;
    const costUSD = (areaM2 * PRICING_CONFIG.CEMENT_BOARD_PRICE_IQD) / state.exchangeRate;
    subtotal+=costUSD; items.push({ label:'بوردكس أسمنتي ('+areaM2.toFixed(2)+' م²)', value:costUSD });
  }

  let total = subtotal;
  if(state.extraFlat > 0){   total += state.extraFlat;  items.push({ label:'إضافي ($)',  value: state.extraFlat }); }
  if(state.extraPct > 0){    const ep=subtotal*(state.extraPct/100);  total+=ep; items.push({ label:'إضافي ('+state.extraPct+'%)',  value: ep }); }
  if(state.discountFlat > 0){ total -= state.discountFlat; items.push({ label:'خصم ($)',   value: -state.discountFlat }); }
  if(state.discountPct > 0){ const dp=subtotal*(state.discountPct/100); total-=dp; items.push({ label:'خصم ('+state.discountPct+'%)', value: -dp }); }

  state.price     = Math.round(total * 100) / 100;
  state.breakdown = items;
}

function getUsage(){ try{ return JSON.parse(localStorage.getItem('ai_usage')||'{}'); }catch(e){ return {}; } }
function bumpUsage(model, u){
  const x = getUsage();
  x.calls = (x.calls||0)+1;
  if(model===AI_IMAGE_MODEL) x.imageCalls = (x.imageCalls||0)+1;
  if(u){ x.pt=(x.pt||0)+(u.prompt_tokens||u.promptTokens||0); x.ct=(x.ct||0)+(u.completion_tokens||u.completionTokens||0); }
  localStorage.setItem('ai_usage', JSON.stringify(x));
}
function resetUsage(){ localStorage.removeItem('ai_usage'); if(typeof renderAi==='function') renderAi(); }

function orPost(model, messages, extra){
  return fetch(OR_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+OR_KEY},
    body:JSON.stringify(Object.assign({model:model, messages:messages}, extra||{}))
  }).then(function(r){ return r.json(); }).then(function(j){
    try{ bumpUsage(model, j&&j.usage); }catch(e){}
    return j;
  });
}
function orText(result){
  const msg=result.choices&&result.choices[0]&&result.choices[0].message;
  if(!msg) throw new Error('استجابة فارغة.');
  if(result.error) throw new Error(result.error.message||JSON.stringify(result.error));
  if(typeof msg.content==='string') return msg.content;
  if(Array.isArray(msg.content)) return msg.content.filter(function(c){return c.type==='text';}).map(function(c){return c.text;}).join('\n');
  return '';
}

function getRefs(){
  try{
    const saved=JSON.parse(localStorage.getItem('sign_refs_v1')||'{}');
    const out={};
    Object.keys(TRAINING_REFS).forEach(function(k){
      out[k]=Object.assign({},TRAINING_REFS[k],saved[k]||{});
    });
    return out;
  } catch(e){ return Object.assign({},TRAINING_REFS); }
}
function saveRef(key,field,val){
  const saved=JSON.parse(localStorage.getItem('sign_refs_v1')||'{}');
  if(!saved[key]) saved[key]={};
  saved[key][field]=val;
  localStorage.setItem('sign_refs_v1',JSON.stringify(saved));
}
function exportRefsCode(){
  const refs=getRefs();
  let c='const TRAINING_REFS = {\n';
  Object.entries(refs).forEach(function(e){
    const k=e[0],v=e[1];
    c+="  '"+k+"': { label:'"+v.label.replace(/'/g,"\\'")+
      "', url:'"+v.url.replace(/'/g,"\\'")+
      "', desc:'"+v.desc.replace(/'/g,"\\'").replace(/\n/g,'\\n')+"' },\n";
  });
  return c+'};';
}
function copyRefsCode(){

  const o = state.options, d = state.dimensions, M = PRICING_CONFIG.MODIFIERS;
  const lines = [];

  // النوع الأساسي: حروف ضوئية بارزة مجسمة (مو صندوق مضيء مسطح)
  const isThermo = o.sideType === 'thermalAcrylic';
  const thick = {t3:'3mm', t4:'4mm', t6:'6mm'}[o.acrylicThickness];
  const aqual = o.acrylicType==='thai' ? 'premium high-clarity Thai acrylic' : 'economy acrylic';

  if(isThermo){
    lines.push(
      'SIGN TYPE: 3D THERMOFORMED / VACUUM-FORMED illuminated sign. '+
      'The entire sign face is heat-molded '+thick+' '+aqual+' that bulges, curves and protrudes outward in relief. '+
      'Letters and shapes are embossed / raised — they pop out from a flat backing panel, creating strong 3D shadows. '+
      'The acrylic face glows from within when lit. This is NOT a flat rectangle — it has deep sculptural relief.'
    );
  } else {
    lines.push(
      'SIGN TYPE: FABRICATED 3D CHANNEL LETTERS (حروف ضوئية بارزة مجسمة). '+
      'Each letter/logo element is individually fabricated as a separate 3D box shape that mounts directly on the wall — '+
      'NOT a flat panel, NOT a lightbox cabinet. '+
      'Each letter has: (1) a '+thick+' '+aqual+' illuminated FACE (front), '+
      '(2) aluminum or metal RETURNS/SIDES giving the letters physical depth (8–15 cm deep), '+
      '(3) open or closed back. '+
      'The letters are spaced slightly apart, floating on the facade independently. '+
      'Between letters the wall surface is visible. '+
      'This is the professional signage style used on storefronts worldwide.'
    );
  }

  // اللف الجانبي (الريتيرن / الجانب)
  if(o.sideType==='aluminumWrap'){
    lines.push('Letter returns/sides: brushed ALUMINUM — clean silver metallic depth on the sides of each channel letter, giving a premium look.');
  } else if(o.sideType==='metalPerforated'){
    lines.push('Letter returns/sides: PERFORATED METAL — the depth/sides of each letter have a fine dot-pattern of punched holes that allow light to bleed through the sides as well.');
  }

  // الوجه
  if(o.perforated){
    lines.push('Letter face: PERFORATED acrylic face — tiny laser-cut holes across the face allow light pinpoints to shine through for a starfield/mesh texture effect.');
  }
  if(o.uvPrinting){
    lines.push('Letter face: UV-PRINTED full-color graphics on the acrylic — rich photographic or illustrated imagery backlit from inside, vivid colors glowing through.');
  }
  if(o.layers>0){
    lines.push(o.layers+' LAYERED depth effect: multiple stacked acrylic or metal layers in front of the main face, creating dramatic shadows and a multi-dimensional raised look — like letters within letters.');
  }

  // الإضاءة
  const ledDesc = {
    economic: 'economy LED modules — functional even glow, slightly cool white, visible light spread',
    standard: 'standard quality LED — bright uniform white illumination, no dark spots, professional result',
    premium:  'premium high-output LED — ultra-bright even glow, crisp white light, restaurant/hotel grade quality'
  }[o.ledType];
  lines.push('Internal LED illumination: '+ledDesc+'. The sign is SWITCHED ON and brightly glowing in the render.');

  // إنارة خلفية (هالة)
  if(o.backLight){
    lines.push('HALO / BACK-LIT effect: additional LEDs mounted behind the letters project a soft glowing halo of light ONTO THE WALL SURFACE behind each letter — creating a floating luminous outline effect, especially visible at night.');
  }

  // كوبوند — ستروك أوفست
  if(o.cobondBack){
    lines.push(
      'COBOND / ACM BACKING with STROKE OFFSET effect: '+
      'Each letter or logo shape has a flat aluminum-composite (ACM/Alucobond) shadow plate BEHIND IT, '+
      'extending 2–4 cm beyond the letter outline on all sides like an outer stroke/offset halo. '+
      'This creates a sharp crisp border / outline silhouette visible around every letter — '+
      'the shadow plate is typically a contrasting color (black, gold, or dark brushed metal) against the lighter wall. '+
      'The 3D letter sits ON TOP of this plate.'
    );
  }

  // الهيكل
  if(o.frameBack!=='none'){
    const fd = {light:'light 3–5cm',medium:'medium 8–10cm',full:'heavy full 15cm+'}[o.frameBack];
    lines.push('Metal back frame: '+fd+' steel/aluminum racetrack or backer that holds the letters away from the wall, adding more projection and shadow depth.');
  }

  // بوردكس
  if(o.hasCementBoard){
    lines.push('Installed on a cement-board (fibro) base panel recessed into or flush-mounted on the facade surface.');
  }

  // النسبة
  const ar = d.width / d.height;
  lines.push('Overall sign composition proportions — width to height ratio: '+d.width+':'+d.height+' ('+(ar>1?'wide horizontal landscape':'tall vertical portrait')+' layout).');

  // حقن مراجع التدريب البصري للخيارات النشطة
  const refs=getRefs();
  function injectRef(k){ const r=refs[k]; if(r&&(r.desc||'').trim()) lines.push('VISUAL REFERENCE for "'+r.label+'": '+r.desc.trim()); }
  injectRef('sideType.'+o.sideType);
  injectRef('ledType.'+o.ledType);
  injectRef('acrylicType.'+o.acrylicType);
  if(o.backLight)   injectRef('option.backLight');
  if(o.cobondBack)  injectRef('option.cobondBack');
  if(o.perforated)  injectRef('option.perforated');
  if(o.uvPrinting)  injectRef('option.uvPrinting');
  if(o.layers>0)    injectRef('option.layers');

  return lines.join('\n\n');
}

// ── ضغط الصورة قبل الإرسال للـAPI (يقلّل صرف التوكنات بشدّة) ──
function shrinkImage(dataUrl, maxDim, quality){
  return new Promise(function(resolve){
    try{
      const img = new Image();
      img.onload = function(){
        let w=img.width, h=img.height; const m=maxDim||1280;
        if(w>m||h>m){ const s=Math.min(m/w,m/h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality||0.82));
      };
      img.onerror=function(){ resolve(dataUrl); };
      img.src=dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}
// يبني أجزاء صور مضغوطة للإرسال
async function buildImageParts(list){
  const out=[];
  for(let i=0;i<list.length;i++){
    if(!list[i]) continue;
    const small=await shrinkImage(list[i],1280,0.82);
    out.push({ type:'image_url', image_url:{ url: small } });
  }
  return out;
}

// ── تتبُّع الصورة (Trace) → أشكال SVG حقيقية قابلة للقص ──
function hexToRgba(h){
  h=(h||'').replace('#','');
  if(h.length===3) h=h.split('').map(function(c){return c+c;}).join('');
  return { r:parseInt(h.slice(0,2),16)||0, g:parseInt(h.slice(2,4),16)||0, b:parseInt(h.slice(4,6),16)||0, a:255 };
}
// أي صورة نقطية نتتبّعها: التصميم التنفيذي أولاً، ثم الإعلان، ثم المرفق المختار
function traceSourceImg(){
  const s=state.ai;
  if(s.traceSrc==='ad')      return s.resultImage;
  if(s.traceSrc==='design')  return s.vectorImage;
  if(typeof s.traceSrc==='number') return state.attachments[s.traceSrc]||null;
  return s.vectorImage || s.resultImage || state.attachments[0] || null;
}
function traceToSVG(){
  if(typeof ImageTracer==='undefined'){ state.ai.svgError='مكتبة التتبُّع لم تُحمّل بعد — تأكد من الاتصال بالإنترنت وأعد المحاولة.'; renderAi(); return; }
  const src = traceSourceImg();
  if(!src){ state.ai.svgError='لا توجد صورة للتتبُّع — ولّد التصميم التنفيذي أو الإعلان أولاً، أو اختر مرفقاً.'; renderAi(); return; }
  state.ai.svgGenerating=true; state.ai.svgError=''; state.ai.svgCode=''; renderAi();

  // خيارات التتبُّع حسب الوضع
  const mode = state.ai.traceMode||'flat';
  const opts = {
    ltres:1, qtres:1, pathomit:8, rightangleenhance:true,
    linefilter:true, strokewidth:0, scale:1, roundcoords:1,
    viewbox:true, desc:false, blurradius:0
  };
  if(state.ai.colors.length){
    // لوحة ألوان مفروضة من المستخدم (أدق للقص)
    opts.pal = state.ai.colors.map(function(c){ return hexToRgba(c.hex); });
    opts.colorsampling = 0;
  } else if(mode==='bw'){
    opts.pal = [{r:255,g:255,b:255,a:255},{r:0,g:0,b:0,a:255}];
    opts.colorsampling = 0;
  } else if(mode==='detailed'){
    opts.numberofcolors = 16; opts.pathomit = 2; opts.ltres = 0.5; opts.qtres = 0.5;
  } else { // flat
    opts.numberofcolors = 6; opts.colorquantcycles = 3;
  }

  try {
    ImageTracer.imageToSVG(src, function(svgstr){
      state.ai.svgCode = svgstr || '';
      if(!state.ai.svgCode) state.ai.svgError='تعذّر التتبُّع — جرّب صورة أنظف.';
      state.ai.svgGenerating=false; renderAi();
    }, opts);
  } catch(e){
    state.ai.svgError='خطأ في التتبُّع: '+(e.message||e);
    state.ai.svgGenerating=false; renderAi();
  }
}

async function generateTraining(){
  const t = state.training;
  if(!t.image){ t.error='ارفع صورة اللوحة المرجعية أولاً.'; render(); return; }

  t.generating=true; t.error=''; t.result=''; render();

  // نبني سياق المواصفات المختارة حالياً بالصفحة
  const o=state.options, M=PRICING_CONFIG.MODIFIERS;
  const currentSpecs=[
    'Acrylic: '+M.acrylicThickness[o.acrylicThickness].label+' / '+M.acrylicType[o.acrylicType].label,
    'Side type: '+M.sideType[o.sideType].label,
    'LED: '+M.ledType[o.ledType].label,
    o.perforated?'Perforated face':null,
    o.uvPrinting?'UV printed face':null,
    o.backLight?'Back-lit halo':null,
    o.cobondBack?'Cobond ACM backing':null,
    o.frameBack!=='none'?'Frame: '+M.frameBack[o.frameBack].label:null,
    o.layers>0?(o.layers+' extra layers'):null,
  ].filter(Boolean).join(', ');

  const userNotes=(t.notes||'').trim();

  const analysisPrompt=
    'You are a professional illuminated sign analyst and prompt engineer for AI image generation.\n\n'+
    'TASK: Analyze this illuminated sign photo and produce a TRAINING SPECIFICATION — a dense technical visual description in English that can be injected into an AI image generation prompt to reproduce this sign style accurately.\n\n'+
    'CURRENTLY SELECTED SPECS (what these specs correspond to in our system):\n'+currentSpecs+'\n\n'+
    (userNotes?'USER NOTES about this reference image: '+userNotes+'\n\n':'')+
    'WHAT TO DESCRIBE (be extremely specific, use professional sign-industry terms):\n'+
    '1. Sign construction type: channel letters / lightbox / thermoformed / combination?\n'+
    '2. Letter/shape materials: acrylic face color, finish (glossy/matte/frosted), thickness impression\n'+
    '3. Returns/sides: material (aluminum/steel/acrylic), color, visible depth in cm estimated\n'+
    '4. Lighting: front-lit / back-lit halo / both / off — color temperature, brightness impression\n'+
    '5. Any cobond/ACM shadow plate with stroke offset around letters? Describe color and offset size\n'+
    '6. Perforations, layers, UV print, special effects if visible\n'+
    '7. Mounting: on wall directly / on racetrack / on board / recessed\n'+
    '8. Overall visual style: premium/economy/decorative/industrial\n'+
    '9. Night/day appearance difference if inferable\n\n'+
    'OUTPUT FORMAT: Write as 3-4 dense technical paragraphs (NOT bullet points, NOT JSON).\n'+
    'Start each paragraph with a bold label like **CONSTRUCTION:**, **LIGHTING:**, **FINISH:**, **INSTALLATION:**\n'+
    'This text will be pasted directly into an AI image prompt, so write it as descriptive instructions.\n'+
    'Be brutally specific — "silver brushed aluminum returns approximately 8cm deep" not just "metal sides".';

  try{
    const smallT = await shrinkImage(t.image,1024,0.8);
    const result=await orPost(AI_VISION_MODEL,[{role:'user', content:[
      {type:'image_url', image_url:{url: smallT}},
      {type:'text', text:analysisPrompt}
    ]}],{max_tokens:1500});
    if(result.error) throw new Error(result.error.message||JSON.stringify(result.error));
    t.result=orText(result);
    if(!t.result) throw new Error('استجابة فارغة من Claude.');
  } catch(e){
    t.error='خطأ: '+(e.message||e);
  } finally {
    t.generating=false; render();
  }
}

function copyTrainingResult(){

    const btn=document.getElementById('copy-training-btn');
    if(btn){ btn.textContent='✅ تم النسخ'; setTimeout(function(){ btn.textContent='نسخ النص'; },2000); }

async function analyzeImageAI(imageData){
  state.analyzing=true; render();
  try {
    const small = await shrinkImage(imageData,1024,0.8);
    const result = await orPost(AI_VISION_MODEL,[{ role:'user', content:[
      { type:'image_url', image_url:{ url: small } },
      { type:'text', text:'Analyze this illuminated sign image. Return ONLY valid JSON (no markdown):\n{"width":<cm>,"height":<cm>,"layers":<0-10>,"perforated":<bool>,"backLight":<bool>,"lightingType":"<standard|chinese>","transformerType":"<standard|original|chinese>","sideWrapping":<bool>,"confidence":{"dimensions":"<high|medium|low>","features":"<high|medium|low>"}}\nIf unsure use standard/false.' }
    ]}],{ max_tokens:800 });
    const txt = orText(result);
    const a = JSON.parse(txt.trim().replace(/^```json\n?|\n?```$/g,''));
    state.dimensions = { width:a.width||100, height:a.height||60 };
    state.confidence = a.confidence||{};
    const o = state.options;
    o.layers=a.layers||0; o.perforated=a.perforated||false; o.backLight=a.backLight||false;
    o.ledType=(a.lightingType==='chinese'?'economic':'standard');
    o.transformerType=(a.transformerType==='chinese'?'economic':a.transformerType==='original'?'premium':'standard');
  } catch(e){ console.error('analyzeImageAI:',e); }
  finally { state.analyzing=false; render(); }
}

              '<div class="flex flex-wrap gap-2">'+
                '<button id="gemini-copy-btn" onclick="copyGeminiPrompt()" class="flex-1 min-w-[120px] py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm">📋 نسخ البرومت</button>'+
                '<button onclick="downloadRefImages()" class="flex-1 min-w-[120px] py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold text-sm">⬇️ تنزيل صور المرجع ('+refCount+')</button>'+
                '<button onclick="openGemini()" class="flex-1 min-w-[120px] py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-sm">🚀 فتح Gemini</button>'+
              '</div>'+
              // التعليمات
              '<div class="bg-white border border-emerald-100 rounded-xl p-3 text-[11px] text-slate-600 leading-relaxed">'+
                '<b class="text-emerald-700">الخطوات:</b> 1) اضغط «تنزيل صور المرجع» (الواجهة + المرفقات). '+
                '2) «نسخ البرومت». 3) «فتح Gemini» → الصق البرومت وأرفق الصور المنزّلة → ولّد مجاناً. '+
                '<span class="text-slate-400">(الصور المولّدة من الأداة لا تُنزَّل هنا — فقط صورك المرجعية.)</span>'+
              '</div>'+
            '</div>' : '')+
        '</div>';
      })()+

      '<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">'+

        // العمود الأيمن: المدخلات
        '<div class="space-y-4">'+
          '<div>'+
            '<label class="text-xs font-bold text-slate-500 block mb-2">1) صورة الواجهة</label>'+
            facadeBox+
          '</div>'+
          '<div>'+
            '<label class="text-xs font-bold text-slate-500 block mb-2">2) نص الإعلان (يُكتب على اللوحة)</label>'+
            '<input type="text" value="'+(ai.adText||'').replace(/"/g,'&quot;')+'" placeholder="مثلاً: مطعم الذواقة" '+
              'onchange="state.ai.adText=this.value" '+
              'class="w-full bg-white border border-fuchsia-200 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-fuchsia-400">'+
          '</div>'+
          '<div>'+
            '<label class="text-xs font-bold text-slate-500 block mb-2">3) تفاصيل إضافية (موقع الإعلان، أسلوب، ألوان مرغوبة...)</label>'+
            '<textarea rows="3" placeholder="مثلاً: الواجهة على شارع رئيسي، أريد اللوحة فوق الباب، ألوان ذهبية فاخرة، تصوير ليلي..." '+
              'onchange="state.ai.extraDetails=this.value" '+
              'class="w-full bg-white border border-fuchsia-200 rounded-xl px-4 py-3 text-sm outline-none resize-none focus:border-fuchsia-400 text-slate-700">'+(ai.extraDetails||'')+'</textarea>'+
          '</div>'+

          // ملخص المواصفات المحقونة
          '<div class="bg-fuchsia-600 rounded-2xl p-4">'+
            '<p class="text-[10px] font-black text-white/80 mb-2">المواصفات التقنية المحقونة تلقائياً في التوليد:</p>'+
            '<div class="flex flex-wrap gap-1.5">'+specChips+'</div>'+
          '</div>'+

          // التحكّم بالتكلفة (إرسال المرفقات للذكاء)
          '<div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 space-y-1.5">'+
            '<label class="flex items-center justify-between gap-2 cursor-pointer select-none">'+
              '<span class="text-[11px] font-bold text-amber-800">إرسال المرفقات كمرجع للذكاء (يزيد الكلفة)</span>'+
              '<input type="checkbox" '+(ai.sendRefs?'checked':'')+' onchange="state.ai.sendRefs=this.checked;renderAi()" class="w-4 h-4 accent-amber-600">'+
            '</label>'+
            '<p class="text-[10px] text-amber-600 leading-relaxed">'+
              'يُرسل الآن للذكاء: صورة الواجهة + <b>'+refAttachments().length+'</b> مرجع (مضغوطة تلقائياً). '+
              'الصور المولّدة لا تُعاد إرسالها. قلّل المراجع لتوفير الكلفة.'+
            '</p>'+
          '</div>'+

          (ai.error ? '<div class="bg-red-50 border border-red-200 text-red-600 text-xs font-bold rounded-xl px-4 py-3">'+ai.error+'</div>' : '')+

          '<button onclick="generateAd()" '+(ai.generating?'disabled':'')+' class="w-full py-3.5 bg-gradient-to-l from-fuchsia-600 to-violet-600 hover:from-fuchsia-500 hover:to-violet-500 text-white rounded-2xl font-black text-sm flex items-center justify-center gap-2 transition '+(ai.generating?'opacity-60 cursor-not-allowed':'')+'">'+
            icon('sparkles','w-4 h-4')+' '+(ai.generating?'جاري التوليد...':'توليد الإعلان')+
          '</button>'+
        '</div>'+

        // العمود الأيسر: النتيجة
        '<div class="bg-white rounded-2xl p-4 border border-slate-100 space-y-1">'+
          resultBox+
          (ai.generating?'':vectorBlock)+
          (ai.generating?'':svgBlock)+
        '</div>'+

      '</div>'+
    '</div>'+
  '</div>';
}

function addAttachment(e){
  Array.from(e.target.files).forEach(function(f){
    const reader = new FileReader();
    reader.onload = function(ev){ state.attachments.push(ev.target.result); render(); };
    reader.readAsDataURL(f);
  });
  e.target.value = '';
}
function removeAttachment(i){ state.attachments.splice(i,1); render(); }

function handleImg(e){
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=function(ev){ state.image=ev.target.result; state.confidence={}; render(); if(state.autoAnalyze!==false) analyzeImageAI(ev.target.result); };
  reader.readAsDataURL(f);
}

function printInvoice(){
  const d=state.dimensions, o=state.options, M=PRICING_CONFIG.MODIFIERS;
  const today=new Date().toLocaleDateString('ar-IQ');

  const cell='padding:6px 10px;font-size:13px;';
  const cellL='padding:6px 10px;font-size:13px;color:#64748b;';
  const rows2=[
    ['قياس اللوحة', d.width+' × '+d.height+' cm', 'اللف الجانبي', M.sideType[o.sideType].label],
    ['سماكة الأكريليك', M.acrylicThickness[o.acrylicThickness].label+' / '+M.acrylicType[o.acrylicType].label, 'نوع الليد', M.ledType[o.ledType].label+' (ضمان '+M.ledType[o.ledType].warranty+(o.ledExtraYears?'+'+o.ledExtraYears:'')+' سنة)'],
    ['نوع المحول', M.transformerType[o.transformerType].label+' (ضمان '+M.transformerType[o.transformerType].warranty+(o.transformerExtraYears?'+'+o.transformerExtraYears:'')+' سنة)', 'مدة التنفيذ', M.rushOrder[o.rushOrder].label],
    ['أجور التركيب', o.installDifficulty==='complex'?('معقد – $'+(o.installComplexCost||0)):'اعتيادي (مجاناً)', 'أكريليك حراري', M.sideType[o.sideType].label],
  ].map(function(r,i){
    const bg=i%2===1?'background:#f8fafc;':'';
    return '<tr style="'+bg+'"><td style="'+cellL+'">'+r[0]+'</td><td style="'+cell+';font-weight:600;">'+r[1]+'</td>'+
      '<td style="'+cellL+';border-right:1px solid #e2e8f0;">'+r[2]+'</td><td style="'+cell+';font-weight:600;">'+r[3]+'</td></tr>';
  }).join('');

  const extraRows=
    (o.hasCementBoard?'<tr><td style="'+cellL+'">بوردكس أسمنتي</td><td style="'+cell+';font-weight:600;" dir="ltr">'+((state.cementBoardDims.width*state.cementBoardDims.height/10000).toFixed(2))+' م²</td><td colspan="2"></td></tr>':'')+
    (state.extraFlat>0?'<tr style="background:#f0fdf4"><td style="'+cellL+'">إضافي ($)</td><td style="'+cell+';font-weight:700;color:#059669" dir="ltr">+$'+state.extraFlat.toFixed(2)+'</td><td colspan="2"></td></tr>':'')+
    (state.extraPct>0?'<tr style="background:#f0fdf4"><td style="'+cellL+'">إضافي ('+state.extraPct+'%)</td><td style="'+cell+';font-weight:700;color:#059669" dir="ltr">+$'+(state.price*(state.extraPct/100)).toFixed(2)+'</td><td colspan="2"></td></tr>':'')+
    (state.discountFlat>0?'<tr style="background:#fff5f5"><td style="'+cellL+'">خصم ($)</td><td style="'+cell+';font-weight:700;color:#dc2626" dir="ltr">-$'+state.discountFlat.toFixed(2)+'</td><td colspan="2"></td></tr>':'')+
    (state.discountPct>0?'<tr style="background:#fff5f5"><td style="'+cellL+'">خصم ('+state.discountPct+'%)</td><td style="'+cell+';font-weight:700;color:#dc2626" dir="ltr">-$'+(state.price*(state.discountPct/100)).toFixed(2)+'</td><td colspan="2"></td></tr>':'');

  const notesHtml=state.notes.trim()?
    '<div style="margin:18px 0;padding:14px 16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;">'+
      '<p style="margin:0 0 6px;font-weight:700;font-size:13px;color:#475569;">ملاحظات</p>'+
      '<p style="margin:0;font-size:13px;color:#1e293b;white-space:pre-wrap;">'+state.notes.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</p>'+
    '</div>':'';

  const designImgHtml=state.image?
    '<div style="margin:16px 0;"><p style="margin:0 0 8px;font-weight:700;font-size:13px;color:#475569;">صورة التصميم</p>'+
      '<img src="'+state.image+'" style="max-width:100%;max-height:280px;object-fit:contain;border:1px solid #e2e8f0;border-radius:8px;display:block;"></div>':'';

  const attachHtml=state.attachments.length?
    '<div style="margin:16px 0;"><p style="margin:0 0 8px;font-weight:700;font-size:13px;color:#475569;">صور مرفقة</p>'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px;">'+
        state.attachments.map(function(src){
          return '<img src="'+src+'" style="width:220px;height:160px;object-fit:contain;border:1px solid #e2e8f0;border-radius:8px;">';
        }).join('')+
      '</div></div>':'';

  document.getElementById('invoice-print').innerHTML=
    '<div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;color:#0f172a;max-width:720px;margin:0 auto;">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #2563eb;padding-bottom:12px;margin-bottom:18px;">'+
        '<div><h1 style="margin:0;font-size:22px;font-weight:800;">فاتورة أولية تقديرية</h1>'+
          '<p style="margin:4px 0 0;color:#64748b;font-size:12px;">نظام التسعير الاحترافي للوحات</p></div>'+
        '<div style="text-align:left;font-size:12px;color:#64748b;">التاريخ: '+today+'</div>'+
      '</div>'+
      '<table style="width:100%;border-collapse:collapse;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;">'+
        rows2+extraRows+
      '</table>'+
      notesHtml+designImgHtml+attachHtml+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:16px;background:#0f172a;color:#fff;border-radius:10px;">'+
        '<span style="font-size:18px;font-weight:bold;">الإجمالي النهائي</span>'+
        '<div style="text-align:left;">'+
          '<div style="font-size:24px;font-weight:800;" dir="ltr">$'+state.price.toFixed(2)+'</div>'+
          '<div style="font-size:14px;font-weight:700;color:#93c5fd;" dir="ltr">'+Math.round(state.price*state.exchangeRate).toLocaleString('ar-IQ')+' د.ع</div>'+
        '</div>'+
      '</div>'+
      '<p style="margin-top:12px;font-size:11px;color:#94a3b8;text-align:center;">هذه فاتورة تقديرية أولية وقابلة للتعديل حسب المعاينة الفعلية.</p>'+
    '</div>';
  const el=document.getElementById('invoice-print');
  el.classList.remove('hidden'); window.print();
  setTimeout(function(){ el.classList.add('hidden'); },500);
}

render();
</script>
