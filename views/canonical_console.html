<section class="page" id="pageCanonicalConsole">
  <div class="page-header">
    <div class="page-header-text">
      <h1 class="page-title">
        <span class="title-icon"><i class="fa-solid fa-diagram-project"></i></span>
        <span data-i18n-ar="العمليات القانونية الموحّدة" data-i18n-en="Canonical Operations">العمليات القانونية الموحّدة</span>
      </h1>
      <p class="page-subtitle" data-i18n-ar="واجهة موحّدة تعمل مباشرة على المحرّك القانوني: المنتجات، الأطراف، المخزون، المبيعات، المشتريات، نقطة البيع، وإدارة العمل. كل قراءة وكل أمر يمرّ عبر الخادم." data-i18n-en="A unified surface driven directly by the canonical engine: products, parties, inventory, sales, procurement, POS and work management. Every read and every command goes through the server.">

      </p>

      <button class="btn btn-secondary" id="ccRefreshBtn" type="button">

      </button>
