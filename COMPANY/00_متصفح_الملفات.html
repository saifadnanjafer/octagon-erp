    font-size: 13px;

    div.className = 'node folder-node' + (totalInside === 0 ? ' empty-folder' : '');

    const toggle = document.createElement('span');
    toggle.className = 'node-toggle' + (hasChildren ? '' : ' empty');
    toggle.textContent = depth === 0 ? '▼' : '▶';
    div.appendChild(toggle);

    const icon = document.createElement('span');
    icon.className = 'node-icon';
    icon.textContent = totalInside > 0 ? '📁' : '📂';
    div.appendChild(icon);

    const name = document.createElement('span');
    name.className = 'node-name';
    name.textContent = node.name;
    div.appendChild(name);

    if (directFiles > 0) {
      const badge = document.createElement('span');
      badge.className = 'file-count-badge';
      badge.textContent = directFiles;
      badge.title = `${directFiles} ملف مباشرة في هذا الفولدر`;
      div.appendChild(badge);
    }

    if (totalInside > 0) {
      const meta = document.createElement('span');
      meta.className = 'node-meta';
      meta.textContent = `(${totalInside} ملف بالكامل)`;
      div.appendChild(meta);
    }

    li.appendChild(div);

    if (hasChildren) {
      const ul = document.createElement('ul');
      if (depth > 0) ul.classList.add('collapsed');
      node.children.forEach(c => ul.appendChild(renderNode(c, depth + 1)));
      li.appendChild(ul);

      div.onclick = (e) => {
        e.stopPropagation();
        ul.classList.toggle('collapsed');
        toggle.textContent = ul.classList.contains('collapsed') ? '▶' : '▼';
      };
    }
  } else {
    totalFiles++;
    const div = document.createElement('div');
    div.className = 'node file-node';

    const toggle = document.createElement('span');
    toggle.className = 'node-toggle empty';
    div.appendChild(toggle);

    const icon = document.createElement('span');
    icon.className = 'node-icon';
    icon.textContent = node.icon || '📄';
    div.appendChild(icon);

    const name = document.createElement('span');
    name.className = 'node-name';
    name.textContent = node.name;
    div.appendChild(name);

    const meta = document.createElement('span');
    meta.className = 'node-meta';
    meta.textContent = formatSize(node.size);
    div.appendChild(meta);

    li.appendChild(div);
  }

  return li;
}

function buildStats() {
  const stats = document.getElementById('stats');
  stats.innerHTML = `
    <div class="stat-box">
      <div class="stat-num">${TREE_DATA.total_files}</div>
      <div class="stat-lbl">ملف</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">${totalFolders}</div>
      <div class="stat-lbl">فولدر</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">${totalFolders - emptyFolders}</div>
      <div class="stat-lbl">فولدر فيه ملفات</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">${emptyFolders}</div>
      <div class="stat-lbl">فولدر فارغ</div>
    </div>
  `;
}

function expandAll() {
  document.querySelectorAll('ul.collapsed').forEach(ul => ul.classList.remove('collapsed'));
  document.querySelectorAll('.node-toggle').forEach(t => {
    if (!t.classList.contains('empty')) t.textContent = '▼';
  });
}
function collapseAll() {
  document.querySelectorAll('#tree ul').forEach(ul => ul.classList.add('collapsed'));
  document.querySelectorAll('.node-toggle').forEach(t => {
    if (!t.classList.contains('empty')) t.textContent = '▶';
  });
  // re-open root
  const root = document.querySelector('#tree > li > ul');
  if (root) {
    root.classList.remove('collapsed');
    root.previousSibling.querySelector('.node-toggle').textContent = '▼';
  }
}
function toggleEmptyOnly() {
  hideEmpty = !hideEmpty;
  document.getElementById('emptyBtn').textContent = hideEmpty
    ? 'إظهار الفولدرات الفارغة' : 'إخفاء الفولدرات الفارغة';
  document.querySelectorAll('li.is-empty').forEach(li => {
    li.classList.toggle('hidden', hideEmpty);
  });
}

// search
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#tree li').forEach(li => {
    li.classList.remove('match');
  });
  if (!q) return;

  const matches = [];
  document.querySelectorAll('#tree li').forEach(li => {
    if (li.dataset.name && li.dataset.name.includes(q)) {
      matches.push(li);
      li.querySelector('.node').classList.add('match');
      // expand all parents
      let parent = li.parentElement;
      while (parent && parent.id !== 'tree') {
        if (parent.tagName === 'UL') parent.classList.remove('collapsed');
        if (parent.previousSibling && parent.previousSibling.querySelector) {
          const t = parent.previousSibling.querySelector('.node-toggle');
          if (t && !t.classList.contains('empty')) t.textContent = '▼';
        }
        parent = parent.parentElement;
      }
    }
  });
});

// build
const root = renderNode(TREE_DATA, 0);
document.getElementById('tree').appendChild(root);
buildStats();
</script>
</body>
</html>
